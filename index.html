function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function abrir(pw) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  var html = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  document.open(); document.write(html); document.close();
}
var err = document.getElementById("err"), saved = null;
try { saved = localStorage.getItem("panel_pw"); } catch (e) {}
if (saved) abrir(saved).catch(function () { try { localStorage.removeItem("panel_pw"); } catch (e) {} });
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault(); err.textContent = "Abriendo...";
  var pw = document.getElementById("pw").value;
  var rem = document.getElementById("rem").checked;
  abrir(pw).then(function () {
    if (rem) { try { localStorage.setItem("panel_pw", pw); } catch (e) {} }
  }, function () { err.textContent = "Contraseña incorrecta."; });
});
